remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dark

title: "osgood"
subtitle: "graphics engineer"
locale: ko-KR
url: "https://osgoodyz.github.io"

author:
  name: "osgood"
  bio: "Graphics engineer · UE5 / Vulkan / Unity"
  location: "Seoul"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/OSgoodYZ"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/osg00d"

include:
  - _pages

plugins:
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed

paginate: 5
paginate_path: /page:num/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: false
      related: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
