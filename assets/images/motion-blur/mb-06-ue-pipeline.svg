<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:13.5px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .d{fill:#c9d1dc;font-size:11.5px}
  .stage{fill:#232833;stroke:#5cd6ff;stroke-width:1.4}
  .out{fill:#1c2029;stroke:#9aa5b8;stroke-width:1;stroke-dasharray:4 3}
</style>
<rect width="800" height="400" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">Unreal Engine 모션 블러: 네 개의 패스</text>

<!-- stage boxes -->
<g>
  <rect x="20" y="56" width="180" height="52" rx="6" class="stage"/>
  <text x="110" y="78" class="h" text-anchor="middle">Velocity 패스</text>
  <text x="110" y="96" class="s" text-anchor="middle">래스터, 움직인 메시만</text>

  <rect x="215" y="56" width="180" height="52" rx="6" class="stage"/>
  <text x="305" y="78" class="h" text-anchor="middle">Velocity Flatten</text>
  <text x="305" y="96" class="s" text-anchor="middle">컴퓨트, 16×16 그룹</text>

  <rect x="410" y="56" width="180" height="52" rx="6" class="stage"/>
  <text x="500" y="78" class="h" text-anchor="middle">Velocity Scatter</text>
  <text x="500" y="96" class="s" text-anchor="middle">래스터, 타일당 쿼드 1개</text>

  <rect x="605" y="56" width="180" height="52" rx="6" class="stage"/>
  <text x="695" y="78" class="h" text-anchor="middle">Motion Blur Filter</text>
  <text x="695" y="96" class="s" text-anchor="middle">컴퓨트 또는 픽셀 셰이더</text>
</g>
<g stroke="#9aa5b8" stroke-width="2">
  <line x1="200" y1="82" x2="213" y2="82" marker-end="url(#ar)"/>
  <line x1="395" y1="82" x2="408" y2="82" marker-end="url(#ar)"/>
  <line x1="590" y1="82" x2="603" y2="82" marker-end="url(#ar)"/>
</g>

<!-- output boxes -->
<g>
  <rect x="20" y="126" width="180" height="56" rx="5" class="out"/>
  <text x="110" y="148" class="t" text-anchor="middle">Velocity 텍스처</text>
  <text x="110" y="166" class="s" text-anchor="middle">움직인 픽셀만 기록, 나머지 빈 값</text>

  <rect x="215" y="126" width="180" height="56" rx="5" class="out"/>
  <text x="305" y="148" class="t" text-anchor="middle">VelocityFlat (속도 + 뎁스)</text>
  <text x="305" y="166" class="s" text-anchor="middle">+ Tile Max 텍스처 (1/16 해상도)</text>

  <rect x="410" y="126" width="180" height="56" rx="5" class="out"/>
  <text x="500" y="148" class="t" text-anchor="middle">Tile Neighbor Max</text>
  <text x="500" y="166" class="s" text-anchor="middle">타일별 "닿을 수 있는" 최대 속도</text>

  <rect x="605" y="126" width="180" height="56" rx="5" class="out"/>
  <text x="695" y="148" class="t" text-anchor="middle">블러된 Scene Color</text>
  <text x="695" y="166" class="s" text-anchor="middle">Bloom · Tonemapper로</text>
</g>

<!-- details -->
<g class="d">
  <text x="28" y="210">· 이전 프레임 변환이 다른 것만</text>
  <text x="28" y="228">· 스키닝 · WPO 포함</text>
  <text x="28" y="246">· 화면상 작은 오브젝트는 생략</text>
  <text x="28" y="264">· 정적 지오메트리는 미기록</text>

  <text x="223" y="210">· 빈 픽셀 → 뎁스로 속도 복원</text>
  <text x="223" y="228">· Amount · Target FPS 스케일</text>
  <text x="223" y="246">· Max 길이 클램프</text>
  <text x="223" y="264">· 그룹 공유 메모리로 타일 맥스</text>

  <text x="418" y="210">· 쿼드를 속도 방향으로 늘림</text>
  <text x="418" y="228">· Z = |v|, 깊이 테스트 Greater</text>
  <text x="418" y="246">· 겹치면 긴 속도만 남는다</text>
  <text x="418" y="264">· 끄면 3×3 게더로 폴백</text>

  <text x="613" y="210">· 타일 맥스 방향 양쪽 샘플링</text>
  <text x="613" y="228">· DepthCmp × SpreadCmp 가중치</text>
  <text x="613" y="246">· 디더 지터 · 품질 1~4</text>
  <text x="613" y="264">· Separable · 하프 해상도 옵션</text>
</g>

<line x1="20" y1="290" x2="785" y2="290" stroke="#3b4252"/>
<text x="24" y="316" class="t">위치: DOF → TAA / TSR → <tspan fill="#5cd6ff" font-weight="600">Motion Blur</tspan> → Bloom → Tonemapper</text>
<text x="24" y="340" class="s">UE5: TSR이 같은 Velocity Flatten 결과를 만들기 때문에 모션 블러가 이를 넘겨받아 재사용할 수 있다</text>
<text x="24" y="362" class="s">UE4: PostProcessMotionBlur.cpp / .usf · UE5: PostProcess/MotionBlur.cpp + Shaders/Private/MotionBlur/</text>
</svg>
