<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5cd6ff"/></marker>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1c2029"/></marker>
  <linearGradient id="smear" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#f6a35a" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#f6a35a" stop-opacity="1"/>
    <stop offset="0.65" stop-color="#f6a35a" stop-opacity="1"/>
    <stop offset="1" stop-color="#f6a35a" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:13.5px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12px}
  .s{fill:#9aa5b8;font-size:11.5px}
</style>
<rect width="800" height="380" rx="8" fill="#1c2029" stroke="#3b4252"/>

<!-- panel A -->
<g transform="translate(20,20)">
  <rect width="240" height="320" rx="6" fill="#232833" stroke="#3b4252"/>
  <text x="120" y="26" class="h" text-anchor="middle">① Scatter: 흩뿌리기</text>
  <rect x="16" y="110" width="208" height="110" fill="#3a4150"/>
  <text x="120" y="240" class="s" text-anchor="middle">회색 벽 (정지)</text>
  <rect x="55" y="140" width="130" height="50" fill="url(#smear)"/>
  <rect x="95" y="140" width="50" height="50" fill="#f6a35a"/>
  <line x1="150" y1="128" x2="200" y2="128" stroke="#5cd6ff" stroke-width="2" marker-end="url(#arc)"/>
  <text x="175" y="121" class="s" text-anchor="middle" fill="#5cd6ff">v</text>
  <line x1="120" y1="165" x2="64" y2="165" stroke="#1c2029" stroke-width="2" marker-end="url(#arw)"/>
  <line x1="120" y1="165" x2="176" y2="165" stroke="#1c2029" stroke-width="2" marker-end="url(#arw)"/>
  <text x="120" y="270" class="t" text-anchor="middle">움직인 픽셀이 자기 색을</text>
  <text x="120" y="287" class="t" text-anchor="middle">지나간 경로 위에 뿌린다</text>
  <text x="120" y="308" class="s" text-anchor="middle">물리적으로 맞지만 GPU엔 안 맞는다 (쓰기 충돌)</text>
</g>

<!-- panel B -->
<g transform="translate(280,20)">
  <rect width="240" height="320" rx="6" fill="#232833" stroke="#3b4252"/>
  <text x="120" y="26" class="h" text-anchor="middle">② Gather: 자기 속도만</text>
  <rect x="16" y="110" width="208" height="110" fill="#3a4150"/>
  <text x="120" y="240" class="s" text-anchor="middle">회색 벽 (정지)</text>
  <rect x="95" y="140" width="50" height="50" fill="#f6a35a"/>
  <line x1="150" y1="128" x2="200" y2="128" stroke="#5cd6ff" stroke-width="2" marker-end="url(#arc)"/>
  <text x="175" y="121" class="s" text-anchor="middle" fill="#5cd6ff">v</text>
  <rect x="160" y="160" width="10" height="10" fill="none" stroke="#e5e9f0" stroke-width="1.5"/>
  <text x="186" y="169" class="t">v = 0</text>
  <line x1="145" y1="140" x2="145" y2="190" stroke="#ff7b72" stroke-width="2"/>
  <text x="120" y="270" class="t" text-anchor="middle">벽 픽셀은 속도가 0이라</text>
  <text x="120" y="287" class="t" text-anchor="middle">읽을 방향이 없다</text>
  <text x="120" y="308" class="s" text-anchor="middle" fill="#ff7b72">경계가 면도날처럼 남는다. 바깥 번짐 실종</text>
</g>

<!-- panel C -->
<g transform="translate(540,20)">
  <rect width="240" height="320" rx="6" fill="#232833" stroke="#3b4252"/>
  <text x="120" y="26" class="h" text-anchor="middle">③ Gather + 이웃 맥스</text>
  <rect x="16" y="110" width="208" height="110" fill="#3a4150"/>
  <text x="120" y="240" class="s" text-anchor="middle">회색 벽 (정지)</text>
  <rect x="55" y="140" width="130" height="50" fill="url(#smear)"/>
  <rect x="95" y="140" width="50" height="50" fill="#f6a35a"/>
  <line x1="150" y1="128" x2="200" y2="128" stroke="#5cd6ff" stroke-width="2" marker-end="url(#arc)"/>
  <text x="175" y="121" class="s" text-anchor="middle" fill="#5cd6ff">v</text>
  <line x1="100" y1="165" x2="214" y2="165" stroke="#e5e9f0" stroke-width="1" stroke-dasharray="3 3"/>
  <circle cx="104" cy="165" r="3.5" fill="#f6a35a" stroke="#1c2029"/>
  <circle cx="118" cy="165" r="3.5" fill="#f6a35a" stroke="#1c2029"/>
  <circle cx="132" cy="165" r="3.5" fill="#f6a35a" stroke="#1c2029"/>
  <circle cx="146" cy="165" r="3.5" fill="#9aa5b8" stroke="#1c2029"/>
  <rect x="160" y="160" width="10" height="10" fill="none" stroke="#e5e9f0" stroke-width="1.5"/>
  <circle cx="184" cy="165" r="3.5" fill="#9aa5b8" stroke="#1c2029"/>
  <circle cx="198" cy="165" r="3.5" fill="#9aa5b8" stroke="#1c2029"/>
  <circle cx="212" cy="165" r="3.5" fill="#9aa5b8" stroke="#1c2029"/>
  <text x="120" y="270" class="t" text-anchor="middle">"누가 나한테 닿나"를 물어</text>
  <text x="120" y="287" class="t" text-anchor="middle">이웃 맥스 방향으로 샘플을 모은다</text>
  <text x="120" y="308" class="s" text-anchor="middle" fill="#7ee787">주황색이 벽 위로 번진다</text>
</g>

<text x="400" y="364" class="s" text-anchor="middle">같은 장면, 같은 속도 버퍼. 차이는 "내가 어디로 가나"가 아니라 "누가 나한테 오나"를 묻는 것뿐이다</text>
</svg>
