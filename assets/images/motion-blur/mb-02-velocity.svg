<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:14px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .box{fill:#232833;stroke:#5cd6ff;stroke-width:1.2}
  .boxo{fill:#232833;stroke:#f6a35a;stroke-width:1.2}
  .boxr{fill:#2a2f3a;stroke:#9aa5b8;stroke-width:1.2}
</style>
<rect width="800" height="400" rx="8" fill="#1c2029" stroke="#3b4252"/>

<!-- left panel -->
<rect x="24" y="20" width="366" height="360" rx="6" fill="none" stroke="#3b4252"/>
<text x="207" y="48" class="h" text-anchor="middle">움직이는 오브젝트: 정점을 두 번 변환</text>

<text x="120" y="78" class="s" text-anchor="middle" fill="#f6a35a">이전 프레임</text>
<text x="294" y="78" class="s" text-anchor="middle" fill="#5cd6ff">현재 프레임</text>

<rect x="48" y="88" width="144" height="46" rx="5" class="boxo"/>
<text x="120" y="107" class="t" text-anchor="middle">정점 위치</text>
<text x="120" y="124" class="s" text-anchor="middle">이전 본 · 변환 · 시간으로</text>
<rect x="222" y="88" width="144" height="46" rx="5" class="box"/>
<text x="294" y="107" class="t" text-anchor="middle">정점 위치</text>
<text x="294" y="124" class="s" text-anchor="middle">현재 본 · 변환 · 시간으로</text>

<line x1="120" y1="134" x2="120" y2="156" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="294" y1="134" x2="294" y2="156" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="48" y="158" width="144" height="46" rx="5" class="boxo"/>
<text x="120" y="177" class="t" text-anchor="middle">PrevViewProj</text>
<text x="120" y="194" class="s" text-anchor="middle">지터 제거된 행렬</text>
<rect x="222" y="158" width="144" height="46" rx="5" class="box"/>
<text x="294" y="177" class="t" text-anchor="middle">ViewProj</text>
<text x="294" y="194" class="s" text-anchor="middle">지터 제거된 행렬</text>

<line x1="120" y1="204" x2="120" y2="226" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="294" y1="204" x2="294" y2="226" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="48" y="228" width="144" height="40" rx="5" class="boxo"/>
<text x="120" y="253" class="t" text-anchor="middle">이전 NDC (x′, y′)</text>
<rect x="222" y="228" width="144" height="40" rx="5" class="box"/>
<text x="294" y="253" class="t" text-anchor="middle">현재 NDC (x, y)</text>

<line x1="120" y1="268" x2="190" y2="300" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>
<line x1="294" y1="268" x2="224" y2="300" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="48" y="302" width="318" height="40" rx="5" class="boxr"/>
<text x="207" y="327" class="t" text-anchor="middle">속도 = (x, y) − (x′, y′)  →  Velocity 버퍼에 기록</text>
<text x="207" y="364" class="s" text-anchor="middle">드로우마다 비용이 붙는다. 그래서 움직인 것만 이 경로를 탄다</text>

<!-- right panel -->
<rect x="410" y="20" width="366" height="360" rx="6" fill="none" stroke="#3b4252"/>
<text x="593" y="48" class="h" text-anchor="middle">정적 지오메트리: 뎁스로 이전 위치를 되찾기</text>

<rect x="443" y="70" width="300" height="40" rx="5" class="box"/>
<text x="593" y="95" class="t" text-anchor="middle">현재 픽셀 (x, y) + 뎁스 버퍼의 z</text>
<line x1="593" y1="110" x2="593" y2="132" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="443" y="134" width="300" height="46" rx="5" class="boxr"/>
<text x="593" y="153" class="t" text-anchor="middle">ClipToPrevClip 행렬 하나로</text>
<text x="593" y="170" class="s" text-anchor="middle">현재 클립 좌표 → 이전 프레임 카메라의 클립 좌표</text>
<line x1="593" y1="180" x2="593" y2="202" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="443" y="204" width="300" height="40" rx="5" class="boxo"/>
<text x="593" y="229" class="t" text-anchor="middle">이전 화면 위치 (x′, y′)</text>
<line x1="593" y1="244" x2="593" y2="266" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>

<rect x="443" y="268" width="300" height="40" rx="5" class="boxr"/>
<text x="593" y="293" class="t" text-anchor="middle">속도 = (x, y) − (x′, y′)</text>

<text x="593" y="336" class="s" text-anchor="middle">풀스크린 패스 하나, 드로우콜과 무관.</text>
<text x="593" y="354" class="s" text-anchor="middle">카메라만 움직인 픽셀은 이 값, 오브젝트가 움직인 픽셀은 왼쪽 값</text>
</svg>
