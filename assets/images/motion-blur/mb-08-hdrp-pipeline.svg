<svg xmlns="http://www.w3.org/2000/svg" width="800" height="410" viewBox="0 0 800 410" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:13.5px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .d{fill:#c9d1dc;font-size:11.5px}
  .src{fill:#232833;stroke:#f6a35a;stroke-width:1.4}
  .buf{fill:#1c2029;stroke:#9aa5b8;stroke-width:1;stroke-dasharray:4 3}
  .stage{fill:#232833;stroke:#5cd6ff;stroke-width:1.4}
</style>
<rect width="800" height="410" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">Unity HDRP 모션 블러: 버퍼를 먼저 완성하고, 컴퓨트 다섯 개로 블러</text>

<!-- row 1: motion vector generation -->
<rect x="30" y="50" width="190" height="46" rx="6" class="src"/>
<text x="125" y="69" class="h" text-anchor="middle">오브젝트 MV 패스</text>
<text x="125" y="86" class="s" text-anchor="middle">Per Object Motion 렌더러</text>
<text x="30" y="116" class="d">· 스킨드: 이전 본 행렬</text>
<text x="30" y="132" class="d">· WPO: 이전 시간으로 재평가</text>

<rect x="240" y="50" width="200" height="46" rx="6" class="src"/>
<text x="340" y="69" class="h" text-anchor="middle">카메라 MV 패스 (풀스크린)</text>
<text x="340" y="86" class="s" text-anchor="middle">스텐실로 빈 픽셀만</text>
<text x="240" y="116" class="d">· 현재 뎁스 × 이전 VP로 역투영</text>
<text x="240" y="132" class="d">· 두 패스로 버퍼가 완성된다</text>

<line x1="220" y1="73" x2="238" y2="73" stroke="#9aa5b8" stroke-width="2"/>
<line x1="440" y1="73" x2="468" y2="73" stroke="#9aa5b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="470" y="50" width="150" height="46" rx="6" class="buf"/>
<text x="545" y="69" class="t" text-anchor="middle">모션 벡터 버퍼</text>
<text x="545" y="86" class="s" text-anchor="middle">float2, NDC 단위</text>
<text x="640" y="66" class="s">TAA · SSR · 업스케일러도</text>
<text x="640" y="82" class="s">같은 버퍼를 읽는다</text>

<!-- connector to row 2 -->
<polyline points="545,96 545,150 110,150 110,166" fill="none" stroke="#9aa5b8" stroke-width="2" marker-end="url(#ar)"/>

<!-- row 2: blur stages -->
<g>
  <rect x="20" y="168" width="180" height="52" rx="6" class="stage"/>
  <text x="110" y="190" class="h" text-anchor="middle">MotionVec Prep</text>
  <text x="110" y="208" class="s" text-anchor="middle">컴퓨트, 풀 해상도</text>

  <rect x="215" y="168" width="180" height="52" rx="6" class="stage"/>
  <text x="305" y="190" class="h" text-anchor="middle">GenTile (32px)</text>
  <text x="305" y="208" class="s" text-anchor="middle">컴퓨트, 1/32 해상도</text>

  <rect x="410" y="168" width="180" height="52" rx="6" class="stage"/>
  <text x="500" y="190" class="h" text-anchor="middle">Neighborhood + Merge</text>
  <text x="500" y="208" class="s" text-anchor="middle">컴퓨트, scatter 또는 gather</text>

  <rect x="605" y="168" width="180" height="52" rx="6" class="stage"/>
  <text x="695" y="190" class="h" text-anchor="middle">MotionBlur</text>
  <text x="695" y="208" class="s" text-anchor="middle">컴퓨트, 풀 해상도</text>
</g>
<g stroke="#9aa5b8" stroke-width="2">
  <line x1="200" y1="194" x2="213" y2="194" marker-end="url(#ar)"/>
  <line x1="395" y1="194" x2="408" y2="194" marker-end="url(#ar)"/>
  <line x1="590" y1="194" x2="603" y2="194" marker-end="url(#ar)"/>
</g>

<!-- details -->
<g class="d">
  <text x="28" y="246">· 카메라 성분 분리 → 클램프</text>
  <text x="28" y="264">· Intensity 배율</text>
  <text x="28" y="282">· Minimum 컷 · Maximum 클램프</text>
  <text x="28" y="300">· 극좌표(길이 · 각도)로 인코딩</text>
  <text x="28" y="318">· 뎁스와 함께 패킹</text>

  <text x="223" y="246">· 타일 최대 속도 (길이 + 방향)</text>
  <text x="223" y="264">· 타일 최소 속도 길이도 기록</text>
  <text x="223" y="282">· min/max 비율 → fast path 판정</text>

  <text x="418" y="246">· scatter: 속도 방향으로 선을 긋고</text>
  <text x="436" y="264">지나는 타일마다 InterlockedMax</text>
  <text x="418" y="282">· 원자 연산 미지원이면 3×3 gather</text>
  <text x="418" y="300">· Merge: 언팩 + 최소 속도 이웃값</text>

  <text x="613" y="246">· 타일이 균일하면 fast path</text>
  <text x="613" y="264">· 타일 맥스 방향 + 자기 방향</text>
  <text x="631" y="282">두 축을 번갈아 샘플</text>
  <text x="613" y="300">· Depth Comparison Extent</text>
  <text x="613" y="318">· Sample Count 만큼 샘플</text>
</g>

<line x1="20" y1="338" x2="785" y2="338" stroke="#3b4252"/>
<text x="24" y="362" class="t">위치: TAA → DOF → <tspan fill="#5cd6ff" font-weight="600">Motion Blur</tspan> → Panini → Bloom → Uber (톤매핑)</text>
<text x="24" y="386" class="s">Runtime/PostProcessing/Shaders/ MotionBlurMotionVecPrep · GenTilePass · NeighborhoodTilePass · MergeTilePass · MotionBlur (.compute)</text>
</svg>
