<svg xmlns="http://www.w3.org/2000/svg" width="800" height="390" viewBox="0 0 800 390" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<style>
  .h{fill:#e5e9f0;font-size:14px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .m{fill:#e5e9f0;font-size:12px;font-family:Consolas,'Courier New',monospace}
  .on{fill:#5cd6ff;fill-opacity:0.55;stroke:#5cd6ff;stroke-width:1.2}
  .onb{fill:#f6a35a;fill-opacity:0.55;stroke:#f6a35a;stroke-width:1.2}
  .off{fill:#232833;stroke:#5a6478;stroke-width:1;stroke-dasharray:3 2}
  .lbl{fill:#e5e9f0;font-size:13px;font-weight:600}
</style>
<rect width="800" height="390" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">웨이브 안에서 if가 갈리면 양쪽을 다 실행한다 (8레인 웨이브, if (x &gt; 0) { A } else { B })</text>

<!-- lane header -->
<g class="s" text-anchor="middle">
  <text x="216" y="66">레인 0</text><text x="260" y="66">1</text><text x="304" y="66">2</text><text x="348" y="66">3</text><text x="392" y="66">4</text><text x="436" y="66">5</text><text x="480" y="66">6</text><text x="524" y="66">7</text>
</g>

<!-- uniform -->
<text x="24" y="100" class="t" font-weight="600">① 균일 분기</text>
<text x="24" y="118" class="s">모든 레인이 x &gt; 0</text>
<text x="160" y="104" class="s" text-anchor="end">A 실행</text>
<g>
  <rect x="200" y="82" width="32" height="32" rx="3" class="on"/><rect x="244" y="82" width="32" height="32" rx="3" class="on"/><rect x="288" y="82" width="32" height="32" rx="3" class="on"/><rect x="332" y="82" width="32" height="32" rx="3" class="on"/><rect x="376" y="82" width="32" height="32" rx="3" class="on"/><rect x="420" y="82" width="32" height="32" rx="3" class="on"/><rect x="464" y="82" width="32" height="32" rx="3" class="on"/><rect x="508" y="82" width="32" height="32" rx="3" class="on"/>
</g>
<g class="lbl" text-anchor="middle"><text x="216" y="103">A</text><text x="260" y="103">A</text><text x="304" y="103">A</text><text x="348" y="103">A</text><text x="392" y="103">A</text><text x="436" y="103">A</text><text x="480" y="103">A</text><text x="524" y="103">A</text></g>
<text x="580" y="103" class="t" fill="#7ee787" font-weight="600">비용 = A</text>
<text x="580" y="121" class="s">B는 건너뛴다</text>
<text x="24" y="152" class="s">상수 버퍼 · 셰이더 상수 · 드로우 단위 플래그로 분기하면 웨이브 전체가 같은 값을 본다 → 분기 명령 하나 값, 거의 공짜</text>

<line x1="24" y1="170" x2="776" y2="170" stroke="#3b4252"/>

<!-- divergent -->
<text x="24" y="206" class="t" font-weight="600">② 발산 분기</text>
<text x="24" y="224" class="s">레인마다 다른 쪽</text>
<text x="160" y="210" class="s" text-anchor="end">A 실행</text>
<g>
  <rect x="200" y="188" width="32" height="32" rx="3" class="on"/><rect x="244" y="188" width="32" height="32" rx="3" class="on"/><rect x="288" y="188" width="32" height="32" rx="3" class="off"/><rect x="332" y="188" width="32" height="32" rx="3" class="on"/><rect x="376" y="188" width="32" height="32" rx="3" class="off"/><rect x="420" y="188" width="32" height="32" rx="3" class="off"/><rect x="464" y="188" width="32" height="32" rx="3" class="on"/><rect x="508" y="188" width="32" height="32" rx="3" class="on"/>
</g>
<g class="lbl" text-anchor="middle"><text x="216" y="209">A</text><text x="260" y="209">A</text><text x="304" y="209" fill="#5a6478">·</text><text x="348" y="209">A</text><text x="392" y="209" fill="#5a6478">·</text><text x="436" y="209" fill="#5a6478">·</text><text x="480" y="209">A</text><text x="524" y="209">A</text></g>
<text x="580" y="209" class="s">3개 레인은 마스크되어 논다</text>

<text x="160" y="254" class="s" text-anchor="end">B 실행</text>
<g>
  <rect x="200" y="232" width="32" height="32" rx="3" class="off"/><rect x="244" y="232" width="32" height="32" rx="3" class="off"/><rect x="288" y="232" width="32" height="32" rx="3" class="onb"/><rect x="332" y="232" width="32" height="32" rx="3" class="off"/><rect x="376" y="232" width="32" height="32" rx="3" class="onb"/><rect x="420" y="232" width="32" height="32" rx="3" class="onb"/><rect x="464" y="232" width="32" height="32" rx="3" class="off"/><rect x="508" y="232" width="32" height="32" rx="3" class="off"/>
</g>
<g class="lbl" text-anchor="middle"><text x="216" y="253" fill="#5a6478">·</text><text x="260" y="253" fill="#5a6478">·</text><text x="304" y="253">B</text><text x="348" y="253" fill="#5a6478">·</text><text x="392" y="253">B</text><text x="436" y="253">B</text><text x="480" y="253" fill="#5a6478">·</text><text x="524" y="253" fill="#5a6478">·</text></g>
<text x="580" y="253" class="s">5개 레인은 마스크되어 논다</text>

<text x="580" y="290" class="t" fill="#ff7b72" font-weight="600">비용 = A + B</text>
<text x="580" y="308" class="s">한 레인만 달라도 전체가 낸다</text>
<text x="24" y="296" class="s">텍스처 결과 · 보간된 속성 · 픽셀 좌표로 분기하면</text>
<text x="24" y="312" class="s">레인마다 값이 다를 수 있다 → 발산 가능</text>

<line x1="24" y1="326" x2="776" y2="326" stroke="#3b4252"/>
<text x="24" y="350" class="s">조건이 화면에서 덩어리져 있으면(그림자 안/밖) 경계에 걸린 웨이브만 발산한다. 노이즈처럼 픽셀마다 바뀌면 거의 모든 웨이브가 발산한다.</text>
<text x="24" y="370" class="s">양쪽이 짧으면 컴파일러가 분기를 없애고 둘 다 계산한 뒤 select 한다 (마스크 관리보다 싸다).</text>
</svg>
