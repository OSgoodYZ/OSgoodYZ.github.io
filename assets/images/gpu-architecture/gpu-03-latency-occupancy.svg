<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
  <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#5a6478" stroke-width="1.5"/></pattern>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:14px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .alu{fill:#5cd6ff;fill-opacity:0.55;stroke:#5cd6ff;stroke-width:1}
  .ld{fill:url(#hatch);stroke:#5a6478;stroke-width:1}
  .lbl{fill:#e5e9f0;font-size:11px}
</style>
<rect width="800" height="430" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">① 기다리는 동안 다른 웨이브를 돌린다</text>

<line x1="140" y1="52" x2="740" y2="52" stroke="#6c7a92" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="748" y="56" class="s">시간</text>

<!-- wave A -->
<text x="130" y="82" class="t" text-anchor="end">웨이브 A</text>
<rect x="140" y="66" width="30" height="22" class="alu"/><rect x="170" y="66" width="30" height="22" class="alu"/>
<rect x="200" y="66" width="200" height="22" class="ld"/>
<rect x="400" y="66" width="30" height="22" class="alu"/><rect x="430" y="66" width="30" height="22" class="alu"/>
<text x="300" y="81" class="lbl" text-anchor="middle">메모리 대기 (수백 사이클)</text>
<!-- wave B -->
<text x="130" y="112" class="t" text-anchor="end">웨이브 B</text>
<rect x="200" y="96" width="30" height="22" class="alu"/><rect x="230" y="96" width="30" height="22" class="alu"/>
<rect x="260" y="96" width="200" height="22" class="ld"/>
<rect x="460" y="96" width="30" height="22" class="alu"/><rect x="490" y="96" width="30" height="22" class="alu"/>
<!-- wave C -->
<text x="130" y="142" class="t" text-anchor="end">웨이브 C</text>
<rect x="260" y="126" width="30" height="22" class="alu"/><rect x="290" y="126" width="30" height="22" class="alu"/>
<rect x="320" y="126" width="200" height="22" class="ld"/>
<rect x="520" y="126" width="30" height="22" class="alu"/><rect x="550" y="126" width="30" height="22" class="alu"/>
<!-- wave D -->
<text x="130" y="172" class="t" text-anchor="end">웨이브 D</text>
<rect x="320" y="156" width="30" height="22" class="alu"/><rect x="350" y="156" width="30" height="22" class="alu"/>
<rect x="380" y="156" width="200" height="22" class="ld"/>
<rect x="580" y="156" width="30" height="22" class="alu"/><rect x="610" y="156" width="30" height="22" class="alu"/>

<!-- compute unit row -->
<text x="130" y="212" class="t" text-anchor="end" font-weight="600">연산 유닛</text>
<g class="alu">
  <rect x="140" y="196" width="60" height="22"/><rect x="200" y="196" width="60" height="22"/><rect x="260" y="196" width="60" height="22"/><rect x="320" y="196" width="60" height="22"/>
  <rect x="400" y="196" width="60" height="22"/><rect x="460" y="196" width="60" height="22"/><rect x="520" y="196" width="60" height="22"/><rect x="580" y="196" width="60" height="22"/>
</g>
<rect x="380" y="196" width="20" height="22" fill="#ff7b72" fill-opacity="0.5" stroke="#ff7b72"/>
<g class="lbl" text-anchor="middle" fill="#1c2029" font-weight="600">
  <text x="170" y="211">A</text><text x="230" y="211">B</text><text x="290" y="211">C</text><text x="350" y="211">D</text><text x="430" y="211">A</text><text x="490" y="211">B</text><text x="550" y="211">C</text><text x="610" y="211">D</text>
</g>
<text x="650" y="211" class="s">← 쉴 틈이 없다</text>
<text x="390" y="234" class="s" text-anchor="middle" fill="#ff7b72">웨이브가 모자라면 여기서 논다</text>

<line x1="24" y1="252" x2="776" y2="252" stroke="#3b4252"/>

<!-- occupancy -->
<text x="24" y="280" class="h">② 점유율: 레지스터 파일을 상주 웨이브가 나눠 쓴다 (RDNA 2 SIMD, VGPR 1024개)</text>
<g>
  <text x="130" y="310" class="t" text-anchor="end">VGPR 64개 사용</text>
  <g class="alu">
    <rect x="140" y="296" width="36" height="20"/><rect x="177" y="296" width="36" height="20"/><rect x="214" y="296" width="36" height="20"/><rect x="251" y="296" width="36" height="20"/><rect x="288" y="296" width="36" height="20"/><rect x="325" y="296" width="36" height="20"/><rect x="362" y="296" width="36" height="20"/><rect x="399" y="296" width="36" height="20"/>
    <rect x="436" y="296" width="36" height="20"/><rect x="473" y="296" width="36" height="20"/><rect x="510" y="296" width="36" height="20"/><rect x="547" y="296" width="36" height="20"/><rect x="584" y="296" width="36" height="20"/><rect x="621" y="296" width="36" height="20"/><rect x="658" y="296" width="36" height="20"/><rect x="695" y="296" width="36" height="20"/>
  </g>
  <text x="740" y="310" class="t" fill="#7ee787">16 웨이브</text>

  <text x="130" y="346" class="t" text-anchor="end">VGPR 128개 사용</text>
  <g class="alu">
    <rect x="140" y="332" width="73" height="20"/><rect x="214" y="332" width="73" height="20"/><rect x="288" y="332" width="73" height="20"/><rect x="362" y="332" width="73" height="20"/><rect x="436" y="332" width="73" height="20"/><rect x="510" y="332" width="73" height="20"/><rect x="584" y="332" width="73" height="20"/><rect x="658" y="332" width="73" height="20"/>
  </g>
  <text x="740" y="346" class="t">8 웨이브</text>

  <text x="130" y="382" class="t" text-anchor="end">VGPR 256개 사용</text>
  <g class="alu">
    <rect x="140" y="368" width="147" height="20"/><rect x="288" y="368" width="147" height="20"/><rect x="436" y="368" width="147" height="20"/><rect x="584" y="368" width="147" height="20"/>
  </g>
  <text x="740" y="382" class="t" fill="#ff7b72">4 웨이브</text>
</g>
<text x="24" y="414" class="s">레지스터를 많이 쓰는 셰이더 = 상주 웨이브가 적다 = 숨길 수 있는 레이턴시가 적다. 단, 메모리를 거의 안 읽는 셰이더는 낮은 점유율로도 충분하다</text>
</svg>
