<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
  <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7ee787"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:14px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .lv{fill:#232833;stroke:#5cd6ff;stroke-width:1.2}
  .cell{fill:#232833;stroke:#9aa5b8;stroke-width:1}
</style>
<rect width="800" height="420" rx="8" fill="#1c2029" stroke="#3b4252"/>

<!-- hierarchy -->
<text x="24" y="30" class="h">① 계층을 내려갈수록 느리고 비싸다</text>
<rect x="150" y="52" width="120" height="40" rx="4" class="lv"/>
<text x="210" y="69" class="t" text-anchor="middle">레지스터</text>
<text x="210" y="85" class="s" text-anchor="middle">수 사이클 · 스레드 전용</text>
<rect x="125" y="100" width="170" height="40" rx="4" class="lv"/>
<text x="210" y="117" class="t" text-anchor="middle">공유 메모리 (LDS)</text>
<text x="210" y="133" class="s" text-anchor="middle">~수십 사이클 · 그룹이 공유</text>
<rect x="100" y="148" width="220" height="40" rx="4" class="lv"/>
<text x="210" y="165" class="t" text-anchor="middle">L1 / 텍스처 캐시</text>
<text x="210" y="181" class="s" text-anchor="middle">~수십 사이클 · 유닛 근처</text>
<rect x="75" y="196" width="270" height="40" rx="4" class="lv"/>
<text x="210" y="213" class="t" text-anchor="middle">L2 캐시</text>
<text x="210" y="229" class="s" text-anchor="middle">~수백 사이클 · 칩 전체 공유</text>
<rect x="50" y="244" width="320" height="40" rx="4" class="lv" stroke="#f6a35a"/>
<text x="210" y="261" class="t" text-anchor="middle">VRAM (GDDR / HBM)</text>
<text x="210" y="277" class="s" text-anchor="middle">수백 사이클 이상 · 칩 밖</text>
<line x1="36" y1="60" x2="36" y2="280" stroke="#9aa5b8" stroke-width="1.5" marker-end="url(#ar)"/>
<text x="40" y="304" class="s">↓ 아래로 갈수록 레이턴시와 에너지가 단계마다 ~10배</text>
<text x="210" y="328" class="t" text-anchor="middle">FP32 곱셈 1회 vs DRAM 32비트 읽기 = 에너지 <tspan fill="#ff7b72" font-weight="600">100배 이상</tspan> 차이</text>
<text x="210" y="346" class="s" text-anchor="middle">수십 TFLOPS 광고값에 못 미치는 이유: 유닛이 데이터를 기다린다</text>

<line x1="410" y1="20" x2="410" y2="350" stroke="#3b4252"/>

<!-- coalescing -->
<text x="430" y="30" class="h">② 메모리는 캐시 라인(64~128B) 단위로 온다</text>
<text x="430" y="60" class="s">8개 스레드가 각자 4바이트를 읽을 때</text>

<!-- case 1 -->
<g class="s" text-anchor="middle">
  <text x="462" y="86">t0</text><text x="500" y="86">t1</text><text x="538" y="86">t2</text><text x="576" y="86">t3</text><text x="614" y="86">t4</text><text x="652" y="86">t5</text><text x="690" y="86">t6</text><text x="728" y="86">t7</text>
</g>
<g stroke="#7ee787" stroke-width="1.2">
  <line x1="462" y1="92" x2="462" y2="112" marker-end="url(#arg)"/><line x1="500" y1="92" x2="500" y2="112" marker-end="url(#arg)"/><line x1="538" y1="92" x2="538" y2="112" marker-end="url(#arg)"/><line x1="576" y1="92" x2="576" y2="112" marker-end="url(#arg)"/><line x1="614" y1="92" x2="614" y2="112" marker-end="url(#arg)"/><line x1="652" y1="92" x2="652" y2="112" marker-end="url(#arg)"/><line x1="690" y1="92" x2="690" y2="112" marker-end="url(#arg)"/><line x1="728" y1="92" x2="728" y2="112" marker-end="url(#arg)"/>
</g>
<rect x="440" y="114" width="308" height="30" rx="5" fill="#7ee787" fill-opacity="0.12" stroke="#7ee787" stroke-width="1.2"/>
<g class="cell">
  <rect x="446" y="120" width="32" height="18"/><rect x="484" y="120" width="32" height="18"/><rect x="522" y="120" width="32" height="18"/><rect x="560" y="120" width="32" height="18"/><rect x="598" y="120" width="32" height="18"/><rect x="636" y="120" width="32" height="18"/><rect x="674" y="120" width="32" height="18"/><rect x="712" y="120" width="32" height="18"/>
</g>
<text x="594" y="166" class="t" text-anchor="middle" fill="#7ee787">연속 주소 → 캐시 라인 1개, 트랜잭션 1번</text>

<!-- case 2 -->
<g class="s" text-anchor="middle">
  <text x="462" y="206">t0</text><text x="500" y="206">t1</text><text x="538" y="206">t2</text><text x="576" y="206">t3</text><text x="614" y="206">t4</text><text x="652" y="206">t5</text><text x="690" y="206">t6</text><text x="728" y="206">t7</text>
</g>
<g stroke="#ff7b72" stroke-width="1.2">
  <line x1="462" y1="212" x2="462" y2="232" marker-end="url(#arr)"/><line x1="500" y1="212" x2="500" y2="232" marker-end="url(#arr)"/><line x1="538" y1="212" x2="538" y2="232" marker-end="url(#arr)"/><line x1="576" y1="212" x2="576" y2="232" marker-end="url(#arr)"/><line x1="614" y1="212" x2="614" y2="232" marker-end="url(#arr)"/><line x1="652" y1="212" x2="652" y2="232" marker-end="url(#arr)"/><line x1="690" y1="212" x2="690" y2="232" marker-end="url(#arr)"/><line x1="728" y1="212" x2="728" y2="232" marker-end="url(#arr)"/>
</g>
<g fill="#ff7b72" fill-opacity="0.12" stroke="#ff7b72" stroke-width="1.2">
  <rect x="446" y="234" width="32" height="30" rx="4"/><rect x="484" y="234" width="32" height="30" rx="4"/><rect x="522" y="234" width="32" height="30" rx="4"/><rect x="560" y="234" width="32" height="30" rx="4"/><rect x="598" y="234" width="32" height="30" rx="4"/><rect x="636" y="234" width="32" height="30" rx="4"/><rect x="674" y="234" width="32" height="30" rx="4"/><rect x="712" y="234" width="32" height="30" rx="4"/>
</g>
<g class="cell">
  <rect x="452" y="240" width="20" height="18"/><rect x="490" y="240" width="20" height="18"/><rect x="528" y="240" width="20" height="18"/><rect x="566" y="240" width="20" height="18"/><rect x="604" y="240" width="20" height="18"/><rect x="642" y="240" width="20" height="18"/><rect x="680" y="240" width="20" height="18"/><rect x="718" y="240" width="20" height="18"/>
</g>
<text x="594" y="286" class="t" text-anchor="middle" fill="#ff7b72">흩어진 주소 → 캐시 라인 8개, 트랜잭션 8번</text>
<text x="594" y="304" class="s" text-anchor="middle">라인의 나머지 바이트는 버린다</text>
<text x="594" y="334" class="t" text-anchor="middle">같은 "4바이트 읽기 한 줄"이 32레인에서는 32배 차이</text>

<line x1="24" y1="364" x2="776" y2="364" stroke="#3b4252"/>
<text x="400" y="392" class="t" text-anchor="middle">ALU 명령 수보다 "픽셀당 몇 바이트를 읽고 쓰는가"를 먼저 센다. 이웃 스레드가 이웃 주소를 읽게 한다 (coalescing)</text>
</svg>
