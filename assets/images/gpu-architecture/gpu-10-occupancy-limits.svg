<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<style>
  .h{fill:#e5e9f0;font-size:14px;font-weight:600}
  .t{fill:#e5e9f0;font-size:12.5px}
  .s{fill:#9aa5b8;font-size:11.5px}
  .lbl{fill:#e5e9f0;font-size:11px}
  .bar{fill:#2b3140;stroke:#6c7a92;stroke-width:1}
  .wave{fill:#f6a35a;fill-opacity:0.35;stroke:#f6a35a;stroke-width:1}
  .grp{fill:#5cd6ff;fill-opacity:0.4;stroke:#5cd6ff;stroke-width:1}
  .slot{fill:#f6a35a;fill-opacity:0.35;stroke:#f6a35a;stroke-width:1}
  .note{fill:#f6a35a;font-size:12px;font-weight:600}
</style>
<rect width="800" height="440" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">연산 유닛은 작업실, 웨이브는 들어와 일하는 팀 — 들어오려면 세 가지 자리가 다 있어야 한다</text>

<!-- ① registers = desks -->
<text x="24" y="72" class="t" font-weight="600">① 레지스터 파일</text>
<text x="24" y="90" class="s">= 책상</text>
<text x="24" y="106" class="s">책상 수는 정해져 있다</text>

<text x="200" y="60" class="s">레지스터를 적게 쓰는 셰이더 — 팀마다 책상 1개</text>
<rect x="200" y="66" width="480" height="26" class="bar"/>
<g class="wave">
  <rect x="202" y="68" width="57" height="22"/><rect x="261" y="68" width="57" height="22"/><rect x="320" y="68" width="57" height="22"/><rect x="379" y="68" width="57" height="22"/>
  <rect x="438" y="68" width="57" height="22"/><rect x="497" y="68" width="57" height="22"/><rect x="556" y="68" width="57" height="22"/><rect x="615" y="68" width="63" height="22"/>
</g>
<g class="lbl" text-anchor="middle">
  <text x="230" y="83">A</text><text x="289" y="83">B</text><text x="348" y="83">C</text><text x="407" y="83">D</text>
  <text x="466" y="83">E</text><text x="525" y="83">F</text><text x="584" y="83">G</text><text x="646" y="83">H</text>
</g>
<text x="692" y="83" class="note">8팀 상주</text>

<text x="200" y="114" class="s">레지스터를 많이 쓰는 셰이더 — 팀마다 책상 4개</text>
<rect x="200" y="120" width="480" height="26" class="bar"/>
<g class="wave">
  <rect x="202" y="122" width="237" height="22"/><rect x="441" y="122" width="237" height="22"/>
</g>
<g class="lbl" text-anchor="middle">
  <text x="320" y="137">A</text><text x="559" y="137">B</text>
</g>
<text x="692" y="137" class="note">2팀 상주</text>

<line x1="24" y1="164" x2="776" y2="164" stroke="#3b4252"/>

<!-- ② shared memory = storage -->
<text x="24" y="196" class="t" font-weight="600">② 공유 메모리</text>
<text x="24" y="214" class="s">= 창고</text>
<text x="24" y="230" class="s">컴퓨트의 groupshared</text>

<text x="200" y="184" class="s">그룹마다 창고 한 칸을 차지한다 — 창고가 차면 책상이 남아도 더 못 들어온다</text>
<rect x="200" y="190" width="480" height="26" class="bar"/>
<g class="grp">
  <rect x="202" y="192" width="117" height="22"/><rect x="321" y="192" width="117" height="22"/><rect x="440" y="192" width="117" height="22"/><rect x="559" y="192" width="119" height="22"/>
</g>
<g class="lbl" text-anchor="middle">
  <text x="260" y="207">그룹 1</text><text x="379" y="207">그룹 2</text><text x="498" y="207">그룹 3</text><text x="618" y="207">그룹 4</text>
</g>
<text x="692" y="207" class="note">4그룹 상주</text>
<text x="200" y="236" class="s">창고를 안 쓰는 픽셀·버텍스 셰이더에는 이 제한이 없다</text>

<line x1="24" y1="256" x2="776" y2="256" stroke="#3b4252"/>

<!-- ③ hardware limit = sign-in sheet -->
<text x="24" y="288" class="t" font-weight="600">③ 하드웨어 상한</text>
<text x="24" y="306" class="s">= 출입 명부 칸</text>
<text x="24" y="322" class="s">칩이 정한 최대 팀 수</text>

<text x="200" y="276" class="s">명부 칸이 다 차면 — 책상과 창고가 남아도 끝</text>
<g class="slot">
  <rect x="200" y="282" width="26" height="24"/><rect x="230" y="282" width="26" height="24"/><rect x="260" y="282" width="26" height="24"/><rect x="290" y="282" width="26" height="24"/>
  <rect x="320" y="282" width="26" height="24"/><rect x="350" y="282" width="26" height="24"/><rect x="380" y="282" width="26" height="24"/><rect x="410" y="282" width="26" height="24"/>
  <rect x="440" y="282" width="26" height="24"/><rect x="470" y="282" width="26" height="24"/><rect x="500" y="282" width="26" height="24"/><rect x="530" y="282" width="26" height="24"/>
  <rect x="560" y="282" width="26" height="24"/><rect x="590" y="282" width="26" height="24"/><rect x="620" y="282" width="26" height="24"/><rect x="650" y="282" width="26" height="24"/>
</g>
<text x="692" y="299" class="note">16팀 상주</text>
<text x="200" y="326" class="s">칸 수는 벤더와 세대마다 다르다. 셰이더로는 바꿀 수 없다</text>

<!-- summary -->
<rect x="24" y="352" width="752" height="68" rx="6" fill="none" stroke="#5cd6ff" stroke-width="1.2" stroke-opacity="0.8"/>
<text x="40" y="378" class="t">상주 웨이브 수 = 셋 중 <tspan fill="#f6a35a" font-weight="600">가장 먼저 꽉 차는 것</tspan>이 정한다</text>
<text x="40" y="402" class="s">대부분의 셰이더에서 먼저 차는 것은 ① 책상, 즉 레지스터 — 이것이 "레지스터 압박"</text>
</svg>
