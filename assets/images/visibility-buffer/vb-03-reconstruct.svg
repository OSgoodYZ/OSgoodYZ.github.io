<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:15px;font-weight:600}
  .t{fill:#e5e9f0;font-size:13px}
  .s{fill:#9aa5b8;font-size:12px}
  .box{fill:#232833;stroke:#3b4252}
  .a{stroke:#9aa5b8;stroke-width:1.6;fill:none;marker-end:url(#ar)}
</style>
<rect width="800" height="360" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">ID 하나에서 표면을 되살리는 과정</text>

<!-- step 1: pixel -->
<rect x="24" y="56" width="160" height="200" rx="6" class="box"/>
<text x="104" y="80" class="t" text-anchor="middle" font-weight="600">① 픽셀</text>
<g stroke="#3b4252">
  <rect x="54" y="100" width="100" height="100" fill="#1c2029"/>
  <line x1="79" y1="100" x2="79" y2="200"/><line x1="104" y1="100" x2="104" y2="200"/><line x1="129" y1="100" x2="129" y2="200"/>
  <line x1="54" y1="125" x2="154" y2="125"/><line x1="54" y1="150" x2="154" y2="150"/><line x1="54" y1="175" x2="154" y2="175"/>
</g>
<rect x="104" y="125" width="25" height="25" fill="#5cd6ff"/>
<text x="104" y="226" class="s" text-anchor="middle">inst 7 · tri 1203</text>

<!-- step 2: indices / vertices -->
<rect x="214" y="56" width="180" height="200" rx="6" class="box"/>
<text x="304" y="80" class="t" text-anchor="middle" font-weight="600">② 삼각형 로드</text>
<text x="230" y="112" class="s">index 버퍼[1203]</text>
<text x="230" y="132" class="t">→ (v0, v1, v2)</text>
<text x="230" y="168" class="s">vertex 버퍼</text>
<text x="230" y="188" class="t">→ 위치, UV, 노멀</text>
<text x="304" y="226" class="s" text-anchor="middle">instance 행렬로 변환</text>

<!-- step 3: barycentric -->
<rect x="424" y="56" width="180" height="200" rx="6" class="box"/>
<text x="514" y="80" class="t" text-anchor="middle" font-weight="600">③ barycentric</text>
<polygon points="450,206 578,190 520,100" fill="#f6a35a" fill-opacity="0.18" stroke="#f6a35a" stroke-width="1.5"/>
<circle cx="450" cy="206" r="3" fill="#f6a35a"/><circle cx="578" cy="190" r="3" fill="#f6a35a"/><circle cx="520" cy="100" r="3" fill="#f6a35a"/>
<text x="442" y="222" class="s">v0</text><text x="578" y="210" class="s">v1</text><text x="528" y="100" class="s">v2</text>
<circle cx="520" cy="168" r="5" fill="#5cd6ff"/>
<text x="514" y="244" class="s" text-anchor="middle">픽셀 레이 ∩ 삼각형 평면</text>

<!-- step 4: shade -->
<rect x="634" y="56" width="142" height="200" rx="6" class="box"/>
<text x="705" y="80" class="t" text-anchor="middle" font-weight="600">④ 보간 · 셰이딩</text>
<text x="650" y="116" class="t">UV, 노멀</text>
<text x="650" y="136" class="t">UV 미분</text>
<text x="650" y="172" class="t">표면 셰이더</text>
<text x="650" y="192" class="t">조명 루프</text>
<text x="705" y="226" class="s" text-anchor="middle">→ 최종 색</text>

<line x1="184" y1="156" x2="210" y2="156" class="a"/>
<line x1="394" y1="156" x2="420" y2="156" class="a"/>
<line x1="604" y1="156" x2="630" y2="156" class="a"/>

<text x="400" y="292" class="t" text-anchor="middle">G-Buffer라면 "저장해 둔 값을 읽기"로 끝날 일을, 매 픽셀 다시 계산한다</text>
<text x="400" y="316" class="s" text-anchor="middle">대신 이웃 픽셀 대부분이 같은 삼각형을 가리켜서 ②의 메모리 읽기는 거의 캐시에서 끝난다</text>
</svg>
