<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<style>
  .h{fill:#e5e9f0;font-size:15px;font-weight:600}
  .t{fill:#e5e9f0;font-size:13px}
  .s{fill:#9aa5b8;font-size:12px}
  .box{fill:#232833;stroke:#3b4252}
</style>
<rect width="800" height="380" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">16×8 타일 하나가 읽어야 하는 삼각형 수</text>

<!-- left: big triangles -->
<rect x="24" y="50" width="364" height="260" rx="6" class="box"/>
<text x="206" y="76" class="t" text-anchor="middle" font-weight="600">삼각형이 픽셀보다 클 때</text>
<g transform="translate(46,96)">
  <rect width="320" height="160" fill="#1c2029" stroke="#3b4252"/>
  <polygon points="0,0 320,0 0,160" fill="#5cd6ff" fill-opacity="0.35"/>
  <polygon points="320,0 320,160 0,160" fill="#f6a35a" fill-opacity="0.35"/>
  <line x1="320" y1="0" x2="0" y2="160" stroke="#e5e9f0" stroke-width="1.2"/>
  <g stroke="#3b4252" stroke-opacity="0.6">
    <line x1="80" y1="0" x2="80" y2="160"/><line x1="160" y1="0" x2="160" y2="160"/><line x1="240" y1="0" x2="240" y2="160"/>
    <line x1="0" y1="40" x2="320" y2="40"/><line x1="0" y1="80" x2="320" y2="80"/><line x1="0" y1="120" x2="320" y2="120"/>
  </g>
</g>
<text x="206" y="282" class="t" text-anchor="middle">128픽셀 → 삼각형 2개</text>
<text x="206" y="300" class="s" text-anchor="middle">첫 픽셀만 메모리에서, 나머지는 캐시 히트</text>

<!-- right: micro triangles -->
<rect x="412" y="50" width="364" height="260" rx="6" class="box"/>
<text x="594" y="76" class="t" text-anchor="middle" font-weight="600">삼각형이 픽셀만 할 때</text>
<g transform="translate(434,96)">
  <rect width="320" height="160" fill="#1c2029" stroke="#3b4252"/>
  <g stroke="#1c2029" stroke-width="1">
    <rect x="0" y="0" width="40" height="40" fill="#5cd6ff" fill-opacity="0.45"/><rect x="40" y="0" width="40" height="40" fill="#f6a35a" fill-opacity="0.45"/>
    <rect x="80" y="0" width="40" height="40" fill="#5cd6ff" fill-opacity="0.25"/><rect x="120" y="0" width="40" height="40" fill="#f6a35a" fill-opacity="0.25"/>
    <rect x="160" y="0" width="40" height="40" fill="#5cd6ff" fill-opacity="0.6"/><rect x="200" y="0" width="40" height="40" fill="#f6a35a" fill-opacity="0.6"/>
    <rect x="240" y="0" width="40" height="40" fill="#5cd6ff" fill-opacity="0.35"/><rect x="280" y="0" width="40" height="40" fill="#f6a35a" fill-opacity="0.35"/>
    <rect x="0" y="40" width="40" height="40" fill="#f6a35a" fill-opacity="0.3"/><rect x="40" y="40" width="40" height="40" fill="#5cd6ff" fill-opacity="0.55"/>
    <rect x="80" y="40" width="40" height="40" fill="#f6a35a" fill-opacity="0.55"/><rect x="120" y="40" width="40" height="40" fill="#5cd6ff" fill-opacity="0.3"/>
    <rect x="160" y="40" width="40" height="40" fill="#f6a35a" fill-opacity="0.4"/><rect x="200" y="40" width="40" height="40" fill="#5cd6ff" fill-opacity="0.4"/>
    <rect x="240" y="40" width="40" height="40" fill="#f6a35a" fill-opacity="0.65"/><rect x="280" y="40" width="40" height="40" fill="#5cd6ff" fill-opacity="0.65"/>
    <rect x="0" y="80" width="40" height="40" fill="#5cd6ff" fill-opacity="0.3"/><rect x="40" y="80" width="40" height="40" fill="#f6a35a" fill-opacity="0.6"/>
    <rect x="80" y="80" width="40" height="40" fill="#5cd6ff" fill-opacity="0.5"/><rect x="120" y="80" width="40" height="40" fill="#f6a35a" fill-opacity="0.3"/>
    <rect x="160" y="80" width="40" height="40" fill="#5cd6ff" fill-opacity="0.25"/><rect x="200" y="80" width="40" height="40" fill="#f6a35a" fill-opacity="0.5"/>
    <rect x="240" y="80" width="40" height="40" fill="#5cd6ff" fill-opacity="0.55"/><rect x="280" y="80" width="40" height="40" fill="#f6a35a" fill-opacity="0.25"/>
    <rect x="0" y="120" width="40" height="40" fill="#f6a35a" fill-opacity="0.5"/><rect x="40" y="120" width="40" height="40" fill="#5cd6ff" fill-opacity="0.35"/>
    <rect x="80" y="120" width="40" height="40" fill="#f6a35a" fill-opacity="0.35"/><rect x="120" y="120" width="40" height="40" fill="#5cd6ff" fill-opacity="0.6"/>
    <rect x="160" y="120" width="40" height="40" fill="#f6a35a" fill-opacity="0.6"/><rect x="200" y="120" width="40" height="40" fill="#5cd6ff" fill-opacity="0.25"/>
    <rect x="240" y="120" width="40" height="40" fill="#f6a35a" fill-opacity="0.45"/><rect x="280" y="120" width="40" height="40" fill="#5cd6ff" fill-opacity="0.45"/>
  </g>
</g>
<text x="594" y="282" class="t" text-anchor="middle">128픽셀 → 삼각형 수십~백여 개</text>
<text x="594" y="300" class="s" text-anchor="middle">읽을 정점이 많아져 캐시를 넘친다</text>

<text x="400" y="342" class="t" text-anchor="middle">재사용이 많을수록 "다시 읽기"가 공짜에 가까워진다</text>
<text x="400" y="362" class="s" text-anchor="middle">논문의 Ecosystem 장면(작은 삼각형이 많은 숲)에서 캐시가 작은 GPU가 끝내 이득을 못 본 이유</text>
</svg>
