<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<style>
  .h{fill:#e5e9f0;font-size:15px;font-weight:600}
  .t{fill:#e5e9f0;font-size:13px}
  .s{fill:#9aa5b8;font-size:12px}
  .c{fill:#1c2029;font-size:13px;font-weight:600}
  .box{fill:#232833;stroke:#3b4252}
</style>
<rect width="800" height="330" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">2013년 논문과 Nanite의 Visibility Buffer</text>

<text x="24" y="70" class="t" font-weight="600">Burns &amp; Hunt</text>
<text x="24" y="88" class="s">32비트 + 하드웨어 depth</text>
<rect x="180" y="58" width="300" height="36" fill="#5cd6ff"/>
<text x="330" y="81" class="c" text-anchor="middle">instance ID + triangle ID (32bit)</text>
<rect x="500" y="58" width="150" height="36" fill="none" stroke="#9aa5b8" stroke-dasharray="4 3"/>
<text x="575" y="81" class="t" text-anchor="middle">depth 버퍼 (별도)</text>

<text x="24" y="146" class="t" font-weight="600">Nanite (UE5)</text>
<text x="24" y="164" class="s">64비트 한 칸에 전부</text>
<rect x="180" y="134" width="234" height="36" fill="#f6a35a"/>
<text x="297" y="157" class="c" text-anchor="middle">depth 30</text>
<rect x="414" y="134" width="210" height="36" fill="#5cd6ff"/>
<text x="519" y="157" class="c" text-anchor="middle">visible cluster 27</text>
<rect x="624" y="134" width="56" height="36" fill="#5cd6ff" fill-opacity="0.6"/>
<text x="652" y="157" class="c" text-anchor="middle">tri 7</text>
<text x="180" y="188" class="s">← 상위 비트(MSB)</text>
<text x="680" y="188" class="s" text-anchor="end">하위 비트(LSB) →</text>

<rect x="24" y="210" width="752" height="96" rx="6" class="box"/>
<text x="44" y="236" class="t">depth를 맨 위 비트에 두면 64비트 정수 비교가 곧 depth test가 된다</text>
<text x="44" y="260" class="s">InterlockedMax(vis, packed) 한 번으로 "더 가까우면 ID까지 통째로 덮어쓰기"가 원자적으로 끝난다</text>
<text x="44" y="282" class="s">그래서 하드웨어 래스터라이저 없이 compute shader로 아주 작은 삼각형을 직접 래스터화할 수 있다</text>
</svg>
