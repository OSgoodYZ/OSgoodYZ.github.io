<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" font-family="'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa5b8"/></marker>
</defs>
<style>
  .h{fill:#e5e9f0;font-size:15px;font-weight:600}
  .t{fill:#e5e9f0;font-size:13px}
  .s{fill:#9aa5b8;font-size:12px}
  .c{fill:#1c2029;font-size:12px;font-weight:600}
  .box{fill:#232833;stroke:#3b4252}
  .a{stroke:#9aa5b8;stroke-width:1.6;fill:none;marker-end:url(#ar)}
</style>
<rect width="800" height="340" rx="8" fill="#1c2029" stroke="#3b4252"/>
<text x="24" y="30" class="h">8x MSAA 픽셀 하나: 샘플은 8개, 셰이딩은 삼각형 수만큼</text>

<!-- pixel with 8 samples -->
<rect x="24" y="50" width="220" height="240" rx="6" class="box"/>
<text x="134" y="74" class="t" text-anchor="middle" font-weight="600">VisBuffer의 샘플 8개</text>
<rect x="44" y="90" width="180" height="180" fill="#1c2029" stroke="#3b4252"/>
<polygon points="44,90 224,90 224,150 44,240" fill="#5cd6ff" fill-opacity="0.2"/>
<polygon points="44,240 224,150 224,270 44,270" fill="#f6a35a" fill-opacity="0.2"/>
<line x1="44" y1="240" x2="224" y2="150" stroke="#e5e9f0" stroke-width="1.2"/>
<g>
  <circle cx="74" cy="112" r="7" fill="#5cd6ff"/><circle cx="154" cy="104" r="7" fill="#5cd6ff"/>
  <circle cx="200" cy="130" r="7" fill="#5cd6ff"/><circle cx="104" cy="160" r="7" fill="#5cd6ff"/>
  <circle cx="180" cy="152" r="7" fill="#5cd6ff"/>
  <circle cx="72" cy="250" r="7" fill="#f6a35a"/><circle cx="140" cy="230" r="7" fill="#f6a35a"/>
  <circle cx="200" cy="200" r="7" fill="#f6a35a"/>
</g>

<!-- dedupe -->
<rect x="290" y="50" width="230" height="240" rx="6" class="box"/>
<text x="405" y="74" class="t" text-anchor="middle" font-weight="600">고유한 ID만 남긴다</text>
<rect x="312" y="104" width="186" height="52" rx="4" fill="#5cd6ff" fill-opacity="0.2" stroke="#5cd6ff"/>
<text x="326" y="126" class="t">삼각형 A</text>
<text x="326" y="146" class="s">가중치 5/8</text>
<rect x="312" y="176" width="186" height="52" rx="4" fill="#f6a35a" fill-opacity="0.2" stroke="#f6a35a"/>
<text x="326" y="198" class="t">삼각형 B</text>
<text x="326" y="218" class="s">가중치 3/8</text>
<text x="405" y="262" class="s" text-anchor="middle">group shared memory에 기록</text>

<!-- shade -->
<rect x="566" y="50" width="210" height="240" rx="6" class="box"/>
<text x="671" y="74" class="t" text-anchor="middle" font-weight="600">셰이딩 2번 → 섞기</text>
<rect x="590" y="110" width="40" height="40" fill="#5cd6ff"/>
<rect x="590" y="182" width="40" height="40" fill="#f6a35a"/>
<text x="642" y="135" class="t">× 5/8</text>
<text x="642" y="207" class="t">× 3/8</text>
<rect x="716" y="146" width="40" height="40" fill="#a9bdc4"/>
<text x="736" y="210" class="s" text-anchor="middle">최종</text>
<text x="671" y="262" class="s" text-anchor="middle">8번이 아니라 2번만 셰이딩</text>

<line x1="244" y1="170" x2="286" y2="170" class="a"/>
<line x1="520" y1="170" x2="562" y2="170" class="a"/>

<text x="400" y="318" class="s" text-anchor="middle">가장자리가 아닌 픽셀은 ID가 하나뿐이라 셰이딩도 한 번. 비용은 경계 픽셀에만 붙는다</text>
</svg>
